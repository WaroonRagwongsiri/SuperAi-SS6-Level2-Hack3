<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UNO Q Punch Score</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0a0c;
      color: #e8e8f0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      gap: 16px;
    }

    .back-button {
      position: fixed;
      top: 12px;
      left: 14px;
      z-index: 60;
      min-height: 42px;
      padding: 0 15px;
      border: 1px solid #262a33;
      border-radius: 10px;
      background: #111;
      color: #9ca3af;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: "Courier New", monospace;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .back-button:hover {
      color: #ef4444;
      border-color: rgba(220, 38, 38, 0.48);
      background: rgba(220, 38, 38, 0.08);
    }

    .back-button svg {
      width: 16px;
      height: 16px;
      transition: transform 180ms ease;
    }

    .back-button:hover svg {
      transform: translateX(-3px);
    }

    h1 {
      font-size: 32px;
      font-weight: 900;
      color: #ffd400;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .cam-wrap {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 3px solid #222;
      transition: border .2s ease, box-shadow .2s ease;
    }

    .cam-wrap.resting {
      border-color: #3dff8f;
      box-shadow: 0 0 24px rgba(61, 255, 143, .22);
    }

    .cam-wrap.punching {
      border-color: #ff3d3d;
      box-shadow: 0 0 34px rgba(255, 61, 61, .45);
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #skeletonCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 8;
    }

    .cross-demo {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 14;
      width: min(30vw, 240px);
      min-width: 150px;
      border: 2px solid rgba(255, 212, 0, .85);
      border-radius: 10px;
      overflow: hidden;
      background: #050505;
      box-shadow: 0 0 22px rgba(255, 212, 0, .28);
      pointer-events: none;
    }

    .cross-demo img {
      width: 100%;
      display: block;
    }

    .cross-demo-label {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .72);
      color: #ffd400;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .06em;
      text-align: center;
      text-transform: uppercase;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #111;
      z-index: 5;
    }

    .placeholder p {
      font-size: 13px;
      color: #555;
      font-family: monospace;
    }

    #openBtn {
      padding: 10px 22px;
      background: #ffd400;
      color: #111;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    #openBtn:hover {
      opacity: .85;
    }

    /* State Badge - Top Left */
    .state-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 30;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #111;
      background: #777;
      border: 2px solid rgba(255,255,255,.25);
      box-shadow: 0 0 20px rgba(0,0,0,.45);
      transition: all .2s ease;
    }

    .state-badge.resting {
      background: #3dff8f;
      color: #06140b;
      box-shadow: 0 0 18px rgba(61,255,143,.45);
    }

    .state-badge.punching {
      background: #ff3d3d;
      color: #fff;
      box-shadow: 0 0 24px rgba(255,61,61,.65);
      animation: pulsePunch .55s infinite alternate;
    }

    .countdown-box {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      min-width: 132px;
      padding: 8px 16px 10px;
      border-radius: 10px;
      background: rgba(0,0,0,.78);
      border: 2px solid rgba(255,255,255,.2);
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,.35);
    }

    .countdown-box .lbl {
      font-size: 10px;
      letter-spacing: 0.14em;
      color: #aaa;
      text-transform: uppercase;
    }

    .countdown-box .num {
      color: #fff;
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
    }

    .countdown-box.resting .num {
      color: #3dff8f;
    }

    .countdown-box.punching .num {
      color: #ff3d3d;
    }

    .start-countdown {
      position: absolute;
      top: 86px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 32;
      min-width: 76px;
      padding: 8px 16px 10px;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, .78);
      border: 2px solid rgba(255, 211, 38, .85);
      border-radius: 999px;
      color: #ffd326;
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 0 18px rgba(255, 211, 38, .24);
      text-shadow: 0 0 14px rgba(255, 211, 38, .42);
      pointer-events: none;
    }

    @keyframes pulsePunch {
      from {
        transform: scale(1);
        filter: brightness(1);
      }
      to {
        transform: scale(1.08);
        filter: brightness(1.25);
      }
    }

    /* Overall Score - Top Right */
    .scorebox {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0,0,0,.78);
      border: 2px solid #ffd400;
      border-radius: 12px;
      padding: 10px 18px 14px;
      text-align: center;
      z-index: 25;
      min-width: 100px;
    }

    .scorebox .lbl {
      font-size: 10px;
      letter-spacing: 0.18em;
      color: #aaa;
      text-transform: uppercase;
    }

    .scorebox .num {
      font-size: 56px;
      font-weight: 900;
      color: #ffd400;
      line-height: 1;
      text-shadow: 0 0 20px rgba(255,212,0,.45);
      transition: transform .12s cubic-bezier(.34,1.56,.64,1);
    }

    .scorebox .num.bump {
      transform: scale(1.3);
    }

    .cross-status {
      margin-top: 6px;
      color: #d4d4d8;
      font-family: "Courier New", monospace;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .cross-status.valid {
      color: #3dff8f;
    }

    .cross-status.invalid {
      color: #ff6b6b;
    }

    .threshold-control {
      margin-top: 10px;
      display: grid;
      gap: 6px;
      text-align: left;
    }

    .threshold-control label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #aaa;
      font-family: "Courier New", monospace;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .threshold-control output {
      color: #ffd400;
      font-size: 12px;
    }

    .threshold-control input {
      width: 100%;
      accent-color: #ffd400;
      cursor: pointer;
    }

    /* Nano Data Box */
    .signal {
      width: 100%;
      max-width: 960px;
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border .2s ease, box-shadow .2s ease;
    }

    .signal.resting {
      border-color: rgba(61,255,143,.35);
    }

    .signal.punching {
      border-color: rgba(255,61,61,.65);
      box-shadow: 0 0 16px rgba(255,61,61,.18);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
      transition: background .3s, box-shadow .3s;
    }

    .dot.live {
      background: #3dff8f;
      box-shadow: 0 0 7px #3dff8f99;
    }

    .signal.punching .dot.live {
      background: #ff3d3d;
      box-shadow: 0 0 9px #ff3d3dcc;
    }

    .raw {
      font-family: monospace;
      font-size: 13px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ts {
      font-family: monospace;
      font-size: 11px;
      color: #555;
      flex-shrink: 0;
    }

    .score-row {
      width: 100%;
      max-width: 960px;
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .score-row .lbl {
      font-size: 11px;
      letter-spacing: 0.14em;
      color: #666;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .score-bar-wrap {
      flex: 1;
      height: 8px;
      background: #1e1e1e;
      border-radius: 4px;
      overflow: hidden;
    }

    .score-bar {
      height: 100%;
      width: 0%;
      background: #ffd400;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .score-num {
      font-size: 28px;
      font-weight: 900;
      color: #ffd400;
      line-height: 1;
      min-width: 52px;
      text-align: right;
      flex-shrink: 0;
    }

    .training-actions {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: center;
    }

    .end-training-button {
      padding: 10px 20px;
      border: 2px solid #ff3d3d;
      border-radius: 8px;
      background: #111;
      color: #ff3d3d;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
    }

    /* Details Grid */
    .details-grid {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 4px;
    }

    .detail-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 14px 10px;
      text-align: center;
    }

    .detail-card .lbl {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .detail-card .val {
      font-size: 26px;
      font-weight: 700;
      color: #e8e8f0;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 24px;
      }

      .state-badge {
        font-size: 13px;
        padding: 8px 12px;
      }

      .scorebox {
        padding: 8px 12px 10px;
        min-width: 82px;
      }

      .scorebox .num {
        font-size: 42px;
      }

      .countdown-box {
        top: 58px;
        min-width: 96px;
        padding: 6px 10px 8px;
      }

      .countdown-box .num {
        font-size: 32px;
      }

      .start-countdown {
        top: 104px;
        min-width: 62px;
        padding: 6px 12px 8px;
        font-size: 26px;
      }

      .score-row {
        padding: 12px;
        gap: 10px;
      }

      .score-row .lbl {
        display: none;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>

<body>
  <button class="back-button" id="backButton" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m12 19-7-7 7-7" />
      <path d="M19 12H5" />
    </svg>
    <span>Back</span>
  </button>

  <h1>UNO Q — Punch Score</h1>

  <div class="cam-wrap resting" id="cam-wrap">
    <div class="state-badge resting" id="state-badge">RESTING</div>
    <div class="countdown-box resting" id="countdown-box">
      <div class="lbl">Next</div>
      <div class="num" id="countdown">2.0</div>
    </div>
    <div class="start-countdown" id="startCountdown">3</div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="skeletonCanvas"></canvas>
    <div class="cross-demo" aria-hidden="true">
      <img src="images/punch_example.gif" alt="">
      <div class="cross-demo-label">Cross Punch</div>
    </div>

    <div class="placeholder" id="ph">
      <p>No camera feed</p>
      <button id="openBtn" onclick="openCam()">Open Webcam</button>
    </div>

    <div class="scorebox">
      <div class="lbl">Punch Score</div>
      <div class="num" id="score">0</div>
      <div class="cross-status" id="crossStatus">ท่าต่อย: รอเริ่ม</div>
      <div class="threshold-control">
        <label for="fistThresholdSlider">
          <span>Fist threshold</span>
          <output id="fistThresholdValue">32%</output>
        </label>
        <input id="fistThresholdSlider" type="range" min="20" max="60" step="1" value="32">
      </div>
    </div>
  </div>

  <div class="signal resting" id="signal-box">
    <div class="dot" id="dot"></div>
    <div class="raw" id="raw">Waiting for Nano signal…</div>
    <div class="ts" id="ts">—</div>
  </div>

  <div class="score-row" id="score-row">
    <div class="lbl">Punch Score</div>
    <div class="score-bar-wrap">
      <div class="score-bar" id="score-bar"></div>
    </div>
    <div class="score-num" id="score-inline">0</div>
  </div>

  <div class="training-actions">
    <button class="end-training-button" id="endTrainingButton" type="button">End Training</button>
  </div>

  <div class="details-grid" id="details-grid"></div>

  <script>
    const DEFAULT_MAX_SCORE = 999;
    let cameraOpening = false;
    let cameraStarted = false;

    async function openCam(options = {}) {
      if (cameraOpening || cameraStarted) return;
      cameraOpening = true;

      try {
        document.querySelector('#ph p').textContent = 'Starting camera...';

        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        const v = document.getElementById('webcam');
        v.srcObject = stream;
        await v.play();
        startPoseTracking(v);

        document.getElementById('ph').style.display = 'none';
        cameraStarted = true;
      } catch (e) {
        document.querySelector('#ph p').textContent = 'Camera permission needed';
        document.getElementById('openBtn').textContent = 'Open Webcam';
        if (!options.silent) {
          alert('Camera error: ' + e.name + ' — ' + e.message);
        }
      } finally {
        cameraOpening = false;
      }
    }

    let currentScore = 0;
    let maxScore = DEFAULT_MAX_SCORE;
    let startReady = false;
    let pollTimer = null;
    let countdownSmoothTimer = null;
    let countdownAnchorValue = 0;
    let countdownAnchorTime = Date.now();
    let poseTracker = null;
    let handTracker = null;
    let poseBusy = false;
    let trainingStartTime = 0;
    let lastPunchId = 0;
    let hasBaselinePunchId = false;
    let punchCount = 0;
    let scoreTotal = 0;
    let latestDetails = {};
    let latestMetrics = {};
    let latestPoseResult = null;
    let latestInvalidPunch = false;
    let currentPunchPhase = false;
    let punchPoseSeries = [];
    let latestHandPunchSample = null;
    let lastCompletedInvalidPunch = false;
    let hasCompletedFormEval = false;
    let lastCompletedCrossEval = { isCross: true, reason: 'good' };
    let realPunchFistRatioPercent = Number(localStorage.getItem('realPunchFistRatioPercent')) || 32;

    function syncFistThresholdControl() {
      const slider = document.getElementById('fistThresholdSlider');
      const value = document.getElementById('fistThresholdValue');
      slider.value = String(realPunchFistRatioPercent);
      value.textContent = `${realPunchFistRatioPercent}%`;
    }

    document.getElementById('fistThresholdSlider').addEventListener('input', (event) => {
      realPunchFistRatioPercent = Number(event.target.value) || 32;
      localStorage.setItem('realPunchFistRatioPercent', String(realPunchFistRatioPercent));
      syncFistThresholdControl();
      updateCrossStatus();
    });
    syncFistThresholdControl();

    document.getElementById('backButton').addEventListener('click', () => {
      window.location.href = 'mode.html';
    });

    document.getElementById('endTrainingButton').addEventListener('click', () => {
      const elapsedSeconds = trainingStartTime
        ? Math.round((Date.now() - trainingStartTime) / 1000)
        : 0;
      const averageScore = punchCount > 0 ? Math.round(scoreTotal / punchCount) : 0;

      localStorage.setItem('trainingResult', JSON.stringify({
        elapsedSeconds,
        punchCount,
        averageScore,
        totalScore: Math.round(scoreTotal),
        details: latestDetails,
        metrics: latestMetrics,
        endedAt: Date.now()
      }));

      window.location.href = 'training_result.html';
    });

    function resizeSkeletonCanvas(video) {
      const canvas = document.getElementById('skeletonCanvas');
      const rect = video.getBoundingClientRect();
      const width = Math.max(1, Math.round(rect.width));
      const height = Math.max(1, Math.round(rect.height));

      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    function drawSkeleton(results) {
      const canvas = document.getElementById('skeletonCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!results.poseLandmarks || typeof drawConnectors !== 'function') return;

      const skeletonColor = currentPunchPhase && latestInvalidPunch ? '#ff6b6b' : '#00ff7f';
      drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {
        color: skeletonColor,
        lineWidth: 4
      });
      drawLandmarks(ctx, results.poseLandmarks, {
        color: '#ff3158',
        lineWidth: 2,
        radius: 3
      });

      if (latestHandPunchSample?.box) {
        const box = latestHandPunchSample.box;
        ctx.save();
        ctx.strokeStyle = latestHandPunchSample.fistRatioPercent >= realPunchFistRatioPercent ? '#ffd400' : '#ffffff';
        ctx.lineWidth = 3;
        ctx.strokeRect(
          box.minX * canvas.width,
          box.minY * canvas.height,
          (box.maxX - box.minX) * canvas.width,
          (box.maxY - box.minY) * canvas.height
        );
        ctx.restore();
      }
    }

    function getCookie(name) {
      return document.cookie
        .split('; ')
        .find((row) => row.startsWith(`${name}=`))
        ?.split('=')
        .slice(1)
        .join('=') || '';
    }

    function getLandmark(results, index) {
      return results.poseLandmarks?.[index] || null;
    }

    function hasUsableLandmark(point) {
      return point
        && Number.isFinite(point.x)
        && Number.isFinite(point.y)
        && Number.isFinite(point.z)
        && (point.visibility === undefined || point.visibility >= 0.45);
    }

    function makeArmSample(results, side) {
      const shoulderIndex = side === 'right' ? POSE_LANDMARKS.RIGHT_SHOULDER : POSE_LANDMARKS.LEFT_SHOULDER;
      const elbowIndex = side === 'right' ? POSE_LANDMARKS.RIGHT_ELBOW : POSE_LANDMARKS.LEFT_ELBOW;
      const wristIndex = side === 'right' ? POSE_LANDMARKS.RIGHT_WRIST : POSE_LANDMARKS.LEFT_WRIST;
      const shoulder = getLandmark(results, shoulderIndex);
      const elbow = getLandmark(results, elbowIndex);
      const wrist = getLandmark(results, wristIndex);

      if (!hasUsableLandmark(shoulder) || !hasUsableLandmark(elbow) || !hasUsableLandmark(wrist)) {
        return null;
      }

      const verticalOffset = wrist.y - shoulder.y;
      const horizontalOffset = wrist.x - shoulder.x;
      const depthReach = shoulder.z - wrist.z;

      return {
        side,
        time: performance.now(),
        x: wrist.x,
        y: wrist.y,
        z: wrist.z,
        horizontalOffset,
        verticalOffset,
        depthReach,
        fistRatioPercent: latestHandPunchSample?.fistRatioPercent || 0,
        estimatedFistWidthM: latestHandPunchSample?.estimatedFistWidthM || 0
      };
    }

    function makeHandPunchSample(handResults, poseResults) {
      if (!handResults.multiHandLandmarks?.length || !poseResults?.poseLandmarks) return null;

      const leftShoulder = getLandmark(poseResults, POSE_LANDMARKS.LEFT_SHOULDER);
      const rightShoulder = getLandmark(poseResults, POSE_LANDMARKS.RIGHT_SHOULDER);
      if (!hasUsableLandmark(leftShoulder) || !hasUsableLandmark(rightShoulder)) return null;

      const videoRect = document.getElementById('webcam').getBoundingClientRect();
      const shoulderPx = Math.hypot(
        (leftShoulder.x - rightShoulder.x) * videoRect.width,
        (leftShoulder.y - rightShoulder.y) * videoRect.height
      );
      if (!(shoulderPx > 0)) return null;

      let largestBox = null;
      let largestSizePx = 0;

      handResults.multiHandLandmarks.forEach((landmarks) => {
        const xs = landmarks.map((point) => point.x);
        const ys = landmarks.map((point) => point.y);
        const box = {
          minX: Math.max(0, Math.min(...xs)),
          minY: Math.max(0, Math.min(...ys)),
          maxX: Math.min(1, Math.max(...xs)),
          maxY: Math.min(1, Math.max(...ys))
        };
        const widthPx = (box.maxX - box.minX) * videoRect.width;
        const heightPx = (box.maxY - box.minY) * videoRect.height;
        const sizePx = Math.max(widthPx, heightPx);

        if (sizePx > largestSizePx) {
          largestSizePx = sizePx;
          largestBox = box;
        }
      });

      if (!largestBox || !(largestSizePx > 0)) return null;

      const shoulderWidthM = Number(getCookie('poseShoulderWidthM')) || 0.40;
      const focalLengthPx = Number(getCookie('poseFocalLengthPx')) || 0;
      const estimatedDistanceM = focalLengthPx > 0
        ? (shoulderWidthM * focalLengthPx) / shoulderPx
        : Number(getCookie('poseCalibrationDistanceM')) || 1.50;
      const estimatedFistWidthM = focalLengthPx > 0
        ? (largestSizePx * estimatedDistanceM) / focalLengthPx
        : (largestSizePx / shoulderPx) * shoulderWidthM;

      return {
        box: largestBox,
        fistSizePx: largestSizePx,
        shoulderPx,
        estimatedDistanceM,
        estimatedFistWidthM,
        fistRatioPercent: (estimatedFistWidthM / shoulderWidthM) * 100
      };
    }

    function onHandResults(results) {
      latestHandPunchSample = makeHandPunchSample(results, latestPoseResult);
    }

    function addPunchPoseSample(results) {
      const sample = {
        left: makeArmSample(results, 'left'),
        right: makeArmSample(results, 'right')
      };

      if (!sample.left && !sample.right) return;

      punchPoseSeries.push(sample);
      if (punchPoseSeries.length > 45) {
        punchPoseSeries.shift();
      }
    }

    function evaluateArmSeries(samples, side) {
      const armSamples = samples.map((sample) => sample[side]).filter(Boolean);

      if (armSamples.length < 3) {
        return { isCross: false, reason: 'no pose', motionGain: 0 };
      }

      const peakIndex = armSamples.reduce((bestIndex, sample, index) => (
        sample.depthReach > armSamples[bestIndex].depthReach ? index : bestIndex
      ), 0);

      const start = armSamples[0];
      const peak = armSamples[peakIndex];
      const forwardGain = peak.depthReach - start.depthReach;
      const xRange = Math.max(...armSamples.map((sample) => sample.x)) - Math.min(...armSamples.map((sample) => sample.x));
      const yRange = Math.max(...armSamples.map((sample) => sample.y)) - Math.min(...armSamples.map((sample) => sample.y));
      const xDrift = Math.abs(peak.x - start.x);
      const yDrift = Math.abs(peak.y - start.y);
      const maxFistRatioPercent = Math.max(...armSamples.map((sample) => sample.fistRatioPercent || 0));

      const isStraightPath = xRange <= 0.42 && yRange <= 0.32 && xDrift <= 0.28 && yDrift <= 0.24;
      const isRealPunch = maxFistRatioPercent >= realPunchFistRatioPercent;

      const isCross = isStraightPath && isRealPunch;
      const reason = isCross
        ? 'real punch'
        : (isStraightPath
          ? (maxFistRatioPercent > 0 ? 'punch forward' : 'show fist')
          : 'punch straight');
      const label = isCross
        ? 'ท่าต่อย: ถูกท่า'
        : (isStraightPath
          ? (maxFistRatioPercent > 0 ? 'ท่าต่อย: ผิดท่า - ต่อยให้สุด' : 'ท่าต่อย: ผิดท่า - ให้เห็นหมัด')
          : 'ท่าต่อย: ผิดท่า - ต่อยให้ตรง');

      return { isCross, reason, label, motionGain: forwardGain, fistRatioPercent: maxFistRatioPercent };
    }

    function evaluateCrossPunchSeries(samples) {
      const leftEval = evaluateArmSeries(samples, 'left');
      const rightEval = evaluateArmSeries(samples, 'right');
      if (leftEval.isCross || rightEval.isCross) {
        return { isCross: true, reason: 'good' };
      }
      return rightEval.motionGain >= leftEval.motionGain ? rightEval : leftEval;
    }

    function updateCrossStatus() {
      const statusEl = document.getElementById('crossStatus');
      if (!currentPunchPhase) {
        const completedGood = hasCompletedFormEval && lastCompletedCrossEval?.isCross;
        statusEl.textContent = hasCompletedFormEval && lastCompletedInvalidPunch
          ? lastCompletedCrossEval.label
          : (completedGood ? 'ท่าต่อย: ถูกท่า' : 'ท่าต่อย: รอเริ่ม');
        statusEl.classList.toggle('valid', completedGood);
        statusEl.classList.toggle('invalid', hasCompletedFormEval && lastCompletedInvalidPunch);
        return;
      }

      latestInvalidPunch = false;
      const fistPercent = latestHandPunchSample?.fistRatioPercent || 0;
      statusEl.textContent = punchPoseSeries.length > 0
        ? (fistPercent >= realPunchFistRatioPercent
          ? `ท่าต่อย: ถูกท่า ${Math.round(fistPercent)}%`
          : `ท่าต่อย: กำลังตรวจ ${Math.round(fistPercent)}%`)
        : 'ท่าต่อย: ไม่เห็นท่า';
      statusEl.classList.toggle('valid', fistPercent >= realPunchFistRatioPercent);
      statusEl.classList.remove('invalid');
    }

    function onPoseResults(results) {
      latestPoseResult = results;
      if (currentPunchPhase) {
        addPunchPoseSample(results);
      }
      updateCrossStatus();
      drawSkeleton(results);
    }

    function startPoseTracking(video) {
      if (poseTracker || typeof Pose !== 'function') return;

      poseTracker = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
      });
      poseTracker.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        enableSegmentation: false,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      poseTracker.onResults(onPoseResults);

      if (typeof Hands === 'function') {
        handTracker = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        handTracker.setOptions({
          maxNumHands: 2,
          modelComplexity: 1,
          minDetectionConfidence: 0.45,
          minTrackingConfidence: 0.45
        });
        handTracker.onResults(onHandResults);
      }

      async function frame() {
        resizeSkeletonCanvas(video);

        if (!poseBusy && video.readyState >= 2) {
          poseBusy = true;
          await poseTracker.send({ image: video }).catch(() => {});
          if (handTracker) {
            await handTracker.send({ image: video }).catch(() => {});
          }
          poseBusy = false;
        }

        requestAnimationFrame(frame);
      }

      frame();
    }

    function updateScore(newScore) {
      const scoreOverlay = document.getElementById('score');
      
      // ถ้าเป็น 'INVALID' แสดงข้อความแทน
      if (newScore === 'INVALID') {
        currentScore = 'INVALID';
        scoreOverlay.textContent = 'ผิดท่า';
        scoreOverlay.style.color = '#ff6b6b';
        scoreOverlay.style.fontSize = '32px';
        document.getElementById('score-inline').textContent = 'ผิดท่า';
        return;
      }
      
      // กรณีปกติ (ท่าถูก)
      const safeScore = Number.isFinite(Number(newScore)) ? Number(newScore) : 0;
      const clampedScore = Math.max(0, Math.min(safeScore, maxScore));
      const roundedScore = Math.round(clampedScore);

      if (roundedScore === currentScore) return;

      currentScore = roundedScore;

      scoreOverlay.textContent = currentScore;
      scoreOverlay.style.color = '#ffd400';
      scoreOverlay.style.fontSize = '56px';

      scoreOverlay.classList.remove('bump');
      void scoreOverlay.offsetWidth;
      scoreOverlay.classList.add('bump');

      setTimeout(() => {
        scoreOverlay.classList.remove('bump');
      }, 180);

      document.getElementById('score-inline').textContent = currentScore;

      const barWidth = maxScore > 0 ? (currentScore / maxScore) * 100 : 0;
      document.getElementById('score-bar').style.width = barWidth + '%';
    }

    function updateState(stateFromApi) {
      const state = String(stateFromApi || 'resting').toLowerCase();

      const isPunching = state === 'punching';
      const displayState = isPunching ? 'PUNCHING' : 'RESTING';

      const badge = document.getElementById('state-badge');
      const camWrap = document.getElementById('cam-wrap');
      const signalBox = document.getElementById('signal-box');
      const countdownBox = document.getElementById('countdown-box');

      badge.textContent = displayState;

      badge.classList.remove('resting', 'punching');
      camWrap.classList.remove('resting', 'punching');
      signalBox.classList.remove('resting', 'punching');
      countdownBox.classList.remove('resting', 'punching');

      if (isPunching) {
        badge.classList.add('punching');
        camWrap.classList.add('punching');
        signalBox.classList.add('punching');
        countdownBox.classList.add('punching');
      } else {
        badge.classList.add('resting');
        camWrap.classList.add('resting');
        signalBox.classList.add('resting');
        countdownBox.classList.add('resting');
      }

      if (!currentPunchPhase && isPunching) {
        punchPoseSeries = [];
        latestHandPunchSample = null;
        latestInvalidPunch = false;
        lastCompletedInvalidPunch = false;
        hasCompletedFormEval = false;
        lastCompletedCrossEval = { isCross: true, reason: 'good' };
      } else if (currentPunchPhase && !isPunching) {
        lastCompletedCrossEval = evaluateCrossPunchSeries(punchPoseSeries);
        lastCompletedInvalidPunch = !lastCompletedCrossEval.isCross;
        hasCompletedFormEval = true;
        latestInvalidPunch = lastCompletedInvalidPunch;
      }

      currentPunchPhase = isPunching;
      updateCrossStatus();
    }

    function updateCountdown(data) {
      const countdown = Number(data.countdown);
      const state = String(data.state || 'resting').toLowerCase();
      const nextLabel = state === 'punching' ? 'Rest In' : 'Punch In';

      document.querySelector('#countdown-box .lbl').textContent = nextLabel;
      if (Number.isFinite(countdown)) {
        countdownAnchorValue = countdown;
        countdownAnchorTime = Date.now();
      }
      renderSmoothCountdown();
    }

    function renderSmoothCountdown() {
      const elapsed = (Date.now() - countdownAnchorTime) / 1000;
      const displayValue = Math.max(0, countdownAnchorValue - elapsed);
      document.getElementById('countdown').textContent = displayValue.toFixed(1);
    }

    function startSmoothCountdown() {
      if (countdownSmoothTimer) return;
      countdownSmoothTimer = setInterval(renderSmoothCountdown, 50);
    }

    function renderDetails(details) {
      const grid = document.getElementById('details-grid');

      if (!details || Object.keys(details).length === 0) {
        return;
      }

      latestDetails = details;

      grid.innerHTML = '';

      for (const [key, val] of Object.entries(details)) {
        if (key === 'duration') continue;

        const cleanLabel = key.replace(/_/g, ' ');
        const numberVal = Number(val);
        const displayVal = Number.isFinite(numberVal) ? Math.round(numberVal) : val;

        grid.innerHTML += `
          <div class="detail-card">
            <div class="lbl">${cleanLabel}</div>
            <div class="val">${displayVal}</div>
          </div>
        `;
      }
    }

    async function poll() {
      if (!startReady) return;

      try {
        const r = await fetch('/latest', { cache: 'no-store' });
        const d = await r.json();

        updateState(d.state);
        updateCountdown(d);
        maxScore = Number.isFinite(Number(d.max_score)) ? Number(d.max_score) : DEFAULT_MAX_SCORE;
        latestMetrics = d.metrics || latestMetrics;

        const raw = d.raw || '';
        const dot = document.getElementById('dot');

        dot.classList.toggle('live', !!raw);
        document.getElementById('raw').textContent = raw || 'Waiting for Nano signal…';

        if (d.time) {
          document.getElementById('ts').textContent =
            new Date(d.time * 1000).toLocaleTimeString();
        } else {
          document.getElementById('ts').textContent = '—';
        }

        const displayedScore = getDisplayedPunchScore(d);
        if (d.latest_score !== undefined) {
          updateScore(displayedScore);
        }

        const punchId = Number(d.punch_id) || 0;
        if (!hasBaselinePunchId) {
          lastPunchId = punchId;
          hasBaselinePunchId = true;
        } else if (punchId > lastPunchId) {
          lastPunchId = punchId;
          punchCount += 1;
          // ✅ เพิ่มเงื่อนไข: ถ้าท่าถูกถึงจะบวกคะแนน
          if (displayedScore !== 'INVALID' && Number.isFinite(Number(displayedScore))) {
            scoreTotal += displayedScore;
          }
        }

        renderDetails(d.details);

      } catch (e) {
        updateState('resting');
      }
    }

    function getDisplayedPunchScore(data) {
      const state = String(data.state || 'resting').toLowerCase();
      const rawScore = Number.isFinite(Number(data.latest_score)) ? Number(data.latest_score) : 0;
      const isBadForm = state === 'punching' ? latestInvalidPunch : lastCompletedInvalidPunch;
      if (isBadForm) {
        return 'INVALID';
      }
      return rawScore;
    }

    function runStartCountdown() {
      const overlay = document.getElementById('startCountdown');
      let count = 3;
      overlay.textContent = count;

      const interval = setInterval(() => {
        count -= 1;

        if (count > 0) {
          overlay.textContent = count;
          return;
        }

        overlay.textContent = 'START';
        setTimeout(() => {
          overlay.style.display = 'none';
          startReady = true;
          trainingStartTime = Date.now();
          fetch('/timer-mode/practice', { method: 'POST', keepalive: true }).catch(() => {});
          poll();
          pollTimer = setInterval(poll, 300);
          startSmoothCountdown();
        }, 650);
        clearInterval(interval);
      }, 1000);
    }

    openCam({ silent: true });
    runStartCountdown();
  </script>
