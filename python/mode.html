<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mode Selection</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #050505;
      font-family: Arial, Helvetica, sans-serif;
    }

    .screen {
      width: 100vw;
      min-height: 100vh;
      padding: clamp(28px, 5vh, 44px) clamp(26px, 6vw, 56px) 48px;
      background: #fff;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 5vw, 38px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0;
    }

    .section-label {
      width: 240px;
      height: 30px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      border-radius: 10px;
      background: #00f334;
      font-size: 20px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(150px, 1fr));
      align-items: start;
      gap: 56px;
    }

    .mode-card {
      min-width: 0;
      text-align: center;
    }

    .mode-art {
      width: 126px;
      height: 104px;
      margin: 0 auto 10px;
      overflow: hidden;
      background: #fff;
    }

    .mode-art img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .mode-button {
      width: 182px;
      max-width: 100%;
      height: 30px;
      border: 0;
      border-radius: 9px;
      background: #00f334;
      color: #050505;
      font: inherit;
      font-size: 22px;
      cursor: pointer;
    }

    .mode-button:disabled {
      background: #d5d5d5;
      color: #0b0b0b;
      cursor: default;
    }

    .caption {
      min-height: 54px;
      margin-top: 4px;
      font-size: 20px;
      line-height: 1.25;
    }

    .divider {
      height: 2px;
      margin: 24px -22px 44px;
      background: #a8a8a8;
    }

    .casual-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(150px, 1fr));
      gap: 54px;
      align-items: start;
      text-align: center;
    }

    .coming-soon {
      width: 240px;
      max-width: 100%;
      min-height: 84px;
      margin: 0 auto;
      border-radius: 10px;
      background: #d5d5d5;
      display: grid;
      place-items: center;
      font-size: 21px;
      line-height: 1.2;
    }

    @media (max-width: 720px) {
      .screen {
        padding: 26px 18px 38px;
      }

      .mode-grid,
      .casual-row {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .section-label {
        width: 100%;
      }

      .divider {
        margin: 30px 0;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <h1>Mode Selection</h1>
    <div class="section-label">Training Mode</div>

    <section class="mode-grid" aria-label="Training modes">
      <article class="mode-card">
        <div class="mode-art practice-art" aria-hidden="true">
          <img src="images/image%2032.png" alt="">
        </div>
        <button class="mode-button" id="practiceButton" type="button">Practice</button>
        <div class="caption">ฝึกท่าทาง ให้ถูกต้อง</div>
      </article>

      <article class="mode-card">
        <div class="mode-art fight-art" aria-hidden="true">
          <img src="images/image%2033.png" alt="">
        </div>
        <button class="mode-button" type="button" disabled>Fight mode</button>
        <div class="caption">ออกกำลังกาย</div>
      </article>

      <article class="mode-card">
        <div class="mode-art board-art" aria-hidden="true">
          <img src="images/image%2034.png" alt="">
        </div>
        <button class="mode-button" type="button" disabled>Leader Board</button>
        <div class="caption">ดูคะแนนของคุณ</div>
      </article>
    </section>

    <div class="divider"></div>

    <section class="casual-row" aria-label="Casual modes">
      <div class="coming-soon">Casual Mode<br>[coming soon]</div>

      <article>
        <button class="mode-button" type="button" disabled>Play Online</button>
        <div class="caption">เล่นกับเพื่อน</div>
      </article>

      <article>
        <button class="mode-button" type="button" disabled>Ranking Mode</button>
        <div class="caption">เล่นแบบจัดอันดับ</div>
      </article>
    </section>
  </main>

  <script>
    document.getElementById('practiceButton').addEventListener('click', () => {
      localStorage.setItem('boxingMode', 'practice');
      window.location.href = 'game.html';
    });
  </script>
</body>
</html>
