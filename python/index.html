<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boxing With Ar Ghong</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, #181818 12px, transparent 12px) 0 0 / 24px 24px,
        #282828;
      color: #050505;
      font-family: Arial, Helvetica, sans-serif;
    }

    .screen {
      width: 100vw;
      min-height: 100vh;
      padding: clamp(12px, 2.2vh, 24px) clamp(18px, 4.8vw, 48px) 40px;
      background: #ffefa8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .start-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-photo {
      width: 189px;
      height: 397px;
      margin-bottom: 4px;
      display: block;
      object-fit: cover;
      object-position: center;
      border: 3px solid #111;
      background: #222;
    }

    h1 {
      width: 100%;
      margin: 0 0 28px;
      font-size: clamp(42px, 8.6vw, 66px);
      font-weight: 400;
      line-height: 1;
      text-align: center;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .name-row {
      width: min(100%, 574px);
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      font-size: 26px;
    }

    .name-row input {
      width: 100%;
      height: 30px;
      padding: 1px 14px;
      border: 0;
      background: #dfe2e6;
      color: #111;
      font: inherit;
      outline: 2px solid transparent;
    }

    .name-row input:focus {
      outline-color: #ffc928;
    }

    .start-button {
      min-width: 144px;
      height: 64px;
      padding: 0 24px;
      border: 0;
      border-radius: 999px;
      background: #ffc928;
      color: #050505;
      font-size: 34px;
      font-weight: 400;
      cursor: pointer;
    }

    .start-button:hover {
      background: #ffd75a;
    }

    .start-button:active {
      transform: translateY(1px);
    }

    @media (max-width: 720px) {
      .screen {
        padding: 12px 16px 34px;
      }

      .logo-photo {
        width: 154px;
        height: 324px;
      }

      h1 {
        margin-bottom: 22px;
        white-space: normal;
      }

      .name-row {
        grid-template-columns: auto 1fr;
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="screen">
    <div class="start-panel">
      <img class="logo-photo" src="images/a-gong.png" alt="Ar Ghong">

      <h1>Boxing With Ar Ghong</h1>

      <label class="name-row">
        <span>Name:</span>
        <input id="playerName" type="text" value="Optimizer01" autocomplete="off">
      </label>

      <button class="start-button" id="startButton" type="button">START</button>
    </div>
  </main>

  <script>
    const nameInput = document.getElementById('playerName');
    const startButton = document.getElementById('startButton');

    startButton.addEventListener('click', () => {
      const playerName = nameInput.value.trim() || 'Optimizer01';
      localStorage.setItem('boxingPlayerName', playerName);
      window.location.href = 'mode.html';
    });

    nameInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        startButton.click();
      }
    });
  </script>
</body>

</html>
