<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boxing With Ar Gong</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --bg: #050505;
      --red: #dc2626;
      --red-dark: #991b1b;
      --text: #ffffff;
      --muted: #a3a3a3;
      --line: rgba(255, 255, 255, 0.12);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .start-page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px) 0 0 / 48px 48px,
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px) 0 0 / 48px 48px,
        #050505;
    }

    .start-page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(90deg, #050505 0%, rgba(5, 5, 5, 0.96) 34%, rgba(5, 5, 5, 0.54) 62%, rgba(5, 5, 5, 0.08) 100%),
        linear-gradient(0deg, #050505 0%, rgba(5, 5, 5, 0.76) 15%, rgba(5, 5, 5, 0) 45%);
    }

    .content {
      position: relative;
      z-index: 3;
      width: min(52%, 760px);
      min-height: 100vh;
      padding: clamp(28px, 5vw, 72px);
      display: flex;
      align-items: center;
    }

    .intro {
      width: min(100%, 440px);
      animation: rise-in 700ms ease-out both;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 34px;
    }

    .mark {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 12px;
      background: var(--red);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 0 24px rgba(220, 38, 38, 0.46);
    }

    .mark svg,
    .input-icon svg,
    .button-icon svg {
      display: block;
      width: 22px;
      height: 22px;
    }

    .eyebrow {
      margin: 0;
      color: #737373;
      font-family: "Courier New", monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.34em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(52px, 7.5vw, 92px);
      font-weight: 900;
      font-style: italic;
      line-height: 0.88;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .with {
      display: block;
      margin: 12px 0 4px;
      color: #737373;
      font-size: clamp(22px, 2.6vw, 34px);
      font-weight: 300;
      font-style: normal;
      letter-spacing: 0.18em;
    }

    .red-glow {
      display: block;
      color: var(--red);
      text-shadow:
        0 0 12px rgba(220, 38, 38, 0.66),
        0 0 34px rgba(220, 38, 38, 0.28);
    }

    .copy {
      margin: 28px 0 32px;
      max-width: 390px;
      color: #b3b3b3;
      font-size: 16px;
      font-weight: 300;
      line-height: 1.65;
    }

    form {
      width: min(100%, 390px);
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #ef4444;
      font-family: "Courier New", monospace;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      user-select: none;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #737373;
      pointer-events: none;
    }

    input {
      width: 100%;
      height: 56px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.055);
      color: #fff;
      padding: 0 18px 0 50px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      outline: none;
      transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    input::placeholder {
      color: #5f5f5f;
    }

    input:focus {
      border-color: var(--red);
      background: rgba(255, 255, 255, 0.075);
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.16);
    }

    button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 12px;
      background: var(--red);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(220, 38, 38, 0.38);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    button::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-105%);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
      transition: transform 760ms ease;
    }

    button:hover {
      transform: scale(1.02);
      background: var(--red-dark);
      box-shadow: 0 0 34px rgba(220, 38, 38, 0.48);
    }

    button:hover::after {
      transform: translateX(105%);
    }

    button:active {
      transform: scale(0.98);
    }

    .button-label {
      position: relative;
      z-index: 1;
      font-size: 16px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .button-icon {
      position: relative;
      z-index: 1;
      color: #fff;
    }

    .hero {
      position: absolute;
      z-index: 1;
      inset: 0 0 0 auto;
      width: min(62%, 980px);
      min-height: 100vh;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.05);
      user-select: none;
      filter: contrast(1.08) saturate(0.92);
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 820px) {
      .start-page {
        display: block;
        min-height: 100vh;
      }

      .start-page::before {
        background:
          linear-gradient(0deg, #050505 0%, rgba(5, 5, 5, 0.96) 42%, rgba(5, 5, 5, 0.62) 68%, rgba(5, 5, 5, 0.18) 100%),
          linear-gradient(180deg, #050505 0%, rgba(5, 5, 5, 0) 22%);
      }

      .content {
        width: 100%;
        min-height: 58vh;
        padding: 28px 22px 34px;
        align-items: flex-end;
      }

      .intro {
        width: 100%;
      }

      .brand-row {
        margin-bottom: 26px;
      }

      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.24em;
      }

      h1 {
        font-size: clamp(48px, 15vw, 66px);
      }

      .copy {
        margin: 22px 0 26px;
      }

      .hero {
        position: relative;
        width: 100%;
        height: 42vh;
        min-height: 280px;
      }
    }
  </style>
</head>

<body>
  <main id="start-page" class="start-page">
    <section class="content" aria-label="Start boxing session">
      <div class="intro">
        <div class="brand-row">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.4 3.2c.7 1.2 1 2.4.8 3.7 1.4.9 2.3 2.5 2.3 4.3 0 2.4-1.7 4.5-4 5l-.9 3.1c-.3 1-1.1 1.7-2.2 1.7H8.3c-1.2 0-2.2-.9-2.3-2.1l-.7-7.1C5 8.7 7.2 6 10.3 5.8c.6-1.8 2.4-3.1 4.4-3.1 1 0 1.9.2 2.7.5ZM9.8 8C8.3 8.1 7.2 9.4 7.3 11l.7 7.5c0 .3.2.5.5.5h4.9c.2 0 .4-.1.5-.4l1.1-4.1h.8c1.5 0 2.8-1.2 2.8-2.8S17.2 9 15.7 9h-.4l.5-1.2c.3-.8.2-1.6-.1-2.4-.3-.3-.7-.5-1.1-.5-1.2 0-2.2.9-2.3 2.1l-.1 1H9.8Z" />
            </svg>
          </div>
          <p class="eyebrow">AI-Powered Motion Boxing</p>
        </div>

        <h1>
          Boxing
          <span class="with">With</span>
          <span class="red-glow">Ar Gong</span>
        </h1>

        <p class="copy">
          Step into the virtual ring. Test your real-time skills. Break active records and become the champion.
        </p>

        <form id="startForm">
          <label for="playerName">Champion Register Name</label>
          <div class="input-wrap">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21a8 8 0 0 0-16 0" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <input id="playerName" type="text" maxlength="15" autocomplete="off" placeholder="Enter your name...">
          </div>

          <button id="startButton" type="submit">
            <span class="button-label">Start Training</span>
            <span class="button-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M13.5 1.8c.8 2.8.1 4.7-1.2 6.2-.8.9-1.7 1.7-2.3 2.8-.7 1.2-.8 2.5-.2 3.9.6-1.2 1.4-2.2 2.5-3.1 1.8-1.5 3.5-3.2 3.7-6.1 3.1 2.1 4.9 5 4.9 8.1 0 4.4-3.6 8-8.5 8s-8.5-3.2-8.5-7.8c0-2.7 1.3-5.1 3.2-7.1.8 1.3 1.7 2 2.7 2.1.6-2.8 1.5-5 3.7-7Z" />
              </svg>
            </span>
          </button>
        </form>
      </div>
    </section>

    <section class="hero" aria-label="Ar Gong boxing hero">
      <img src="images/a-gong.png" alt="Ar Gong boxing grandmaster">
    </section>
  </main>

  <script>
    const form = document.getElementById('startForm');
    const nameInput = document.getElementById('playerName');
    const savedName = localStorage.getItem('boxingPlayerName') || '';

    nameInput.value = savedName;

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const playerName = nameInput.value.trim() || 'CHAMP';
      localStorage.setItem('boxingPlayerName', playerName);
      window.location.href = 'mode.html';
    });
  </script>
</body>

</html>
