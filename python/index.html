<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UNO Q Webcam</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0c; color: #e8e8f0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 24px 16px 40px; gap: 16px;
    }
    h1 { font-size: 32px; font-weight: 900; color: #ffd400; letter-spacing: 0.04em; }
    .cam-wrap {
      position: relative; width: 100%; max-width: 960px;
      aspect-ratio: 16/9; background: #000;
      border-radius: 14px; overflow: hidden; border: 1px solid #222;
    }
    #webcam { width: 100%; height: 100%; object-fit: cover; display: block; }
    .placeholder {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; background: #111;
    }
    .placeholder p { font-size: 13px; color: #555; font-family: monospace; }
    #openBtn {
      padding: 10px 22px; background: #ffd400; color: #111;
      border: none; border-radius: 8px; font-weight: 700;
      font-size: 15px; cursor: pointer;
    }
    #openBtn:hover { opacity: .85; }
    
    /* Overall Score - Top Right */
    .scorebox {
      position: absolute; top: 14px; right: 14px;
      background: rgba(0,0,0,.78); border: 2px solid #ffd400;
      border-radius: 12px; padding: 10px 18px 14px;
      text-align: center; z-index: 20; min-width: 100px;
    }
    .scorebox .lbl { font-size: 10px; letter-spacing: 0.18em; color: #666; text-transform: uppercase; }
    .scorebox .num {
      font-size: 56px; font-weight: 900; color: #ffd400; line-height: 1;
      text-shadow: 0 0 20px rgba(255,212,0,.45);
      transition: transform .12s cubic-bezier(.34,1.56,.64,1);
    }
    .scorebox .num.bump { transform: scale(1.3); }
    
    /* Nano Data Box */
    .signal {
      width: 100%; max-width: 960px; background: #111;
      border: 1px solid #222; border-radius: 10px;
      padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #333; flex-shrink: 0; transition: background .3s; }
    .dot.live { background: #3dff8f; box-shadow: 0 0 7px #3dff8f99; }
    .raw { font-family: monospace; font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ts { font-family: monospace; font-size: 11px; color: #555; flex-shrink: 0; }
    
    /* Details Grid - Below Nano Data */
    .details-grid {
      width: 100%; max-width: 960px;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px; margin-top: 4px;
    }
    .detail-card {
      background: #111; border: 1px solid #222; border-radius: 10px;
      padding: 14px 10px; text-align: center;
    }
    .detail-card .lbl { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
    .detail-card .val { font-size: 26px; font-weight: 700; color: #e8e8f0; }

    .score-row {
      width: 100%; max-width: 960px;
      background: #111; border: 1px solid #222; border-radius: 10px;
      padding: 14px 20px; display: flex; align-items: center; gap: 16px;
    }
    .score-row .lbl { font-size: 11px; letter-spacing: 0.14em; color: #666; text-transform: uppercase; flex-shrink: 0; }
    .score-bar-wrap { flex: 1; height: 8px; background: #1e1e1e; border-radius: 4px; overflow: hidden; }
    .score-bar { height: 100%; width: 0%; background: #ffd400; border-radius: 4px; transition: width 0.4s ease; }
    .score-num { font-size: 28px; font-weight: 900; color: #ffd400; line-height: 1; min-width: 52px; text-align: right; flex-shrink: 0; }
  </style>
</head>
<body>
  <h1>UNO Q — Webcam</h1>
  
  <div class="cam-wrap">
    <video id="webcam" autoplay playsinline muted></video>
    <div class="placeholder" id="ph">
      <p>No camera feed</p>
      <button id="openBtn" onclick="openCam()">Open Webcam</button>
    </div>
    
    <div class="scorebox">
      <div class="lbl">Punch Score</div>
      <div class="num" id="score">0</div>
    </div>
  </div>
  
  <div class="signal">
    <div class="dot" id="dot"></div>
    <div class="raw" id="raw">Waiting for Nano signal…</div>
    <div class="ts" id="ts">—</div>
  </div>

  <div class="score-row" id="score-row">
    <div class="lbl">Punch Score</div>
    <div class="score-bar-wrap">
      <div class="score-bar" id="score-bar"></div>
    </div>
    <div class="score-num" id="score-inline">0</div>
  </div>
  
  <div class="details-grid" id="details-grid"></div>

  <script>
    async function openCam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        const v = document.getElementById('webcam');
        v.srcObject = stream;
        await v.play();
        document.getElementById('ph').style.display = 'none';
      } catch (e) {
        alert('Camera error: ' + e.name + ' — ' + e.message);
      }
    }
    
    let currentScore = 0;
    
    function updateScore(newScore) {
      if (newScore === currentScore) return;
      currentScore = newScore;
    
      // existing top-right overlay
      const el = document.getElementById('score');
      el.textContent = currentScore;
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
      setTimeout(() => el.classList.remove('bump'), 180);
    
      // new inline score row
      document.getElementById('score-inline').textContent = Math.round(currentScore);
      document.getElementById('score-bar').style.width = Math.min(currentScore, 100) + '%';
    }
    
    async function poll() {
      try {
        const r = await fetch('/latest', { cache: 'no-store' });
        const d = await r.json();
        
        // Update raw signal
        const raw = d.raw || '';
        document.getElementById('dot').classList.toggle('live', !!raw);
        document.getElementById('raw').textContent = raw || 'Waiting for Nano signal…';
        
        if (d.time) {
          document.getElementById('ts').textContent = new Date(d.time * 1000).toLocaleTimeString();
        }
        
        // Update top-right overall score
        if (d.latest_score !== undefined) {
           updateScore(d.latest_score);
        }
        
        // Render the detailed metric cards
        if (d.details && Object.keys(d.details).length > 0) {
           const grid = document.getElementById('details-grid');
           grid.innerHTML = ''; // Clear previous
           
           for (const [key, val] of Object.entries(d.details)) {
               // Remove underscores for cleaner labels
               const cleanLabel = key.replace(/_/g, ' '); 
               grid.innerHTML += `
                 <div class="detail-card">
                   <div class="lbl">${cleanLabel}</div>
                   <div class="val">${Math.round(val)}</div>
                 </div>`;
           }
        }
        
      } catch (_) {}
    }
    
    setInterval(poll, 300);
    poll();
  </script>
</body>
</html>
