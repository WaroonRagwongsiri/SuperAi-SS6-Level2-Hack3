<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Result</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --bg: #050505;
      --panel: rgba(255, 255, 255, 0.06);
      --line: rgba(255, 255, 255, 0.12);
      --red: #dc2626;
      --muted: #a1a1aa;
      --amber: #f59e0b;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .screen {
      min-height: 100vh;
      padding: clamp(18px, 4vw, 36px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
      background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 48px 48px,
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 48px 48px,
        radial-gradient(circle at 22% 18%, rgba(220,38,38,.18), transparent 34%),
        radial-gradient(circle at 78% 74%, rgba(220,38,38,.1), transparent 34%),
        #050505;
    }

    .result-shell {
      width: min(100%, 980px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 24px;
      align-items: stretch;
    }

    .poster,
    .panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.035));
      box-shadow: 0 24px 54px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.08);
      overflow: hidden;
    }

    .poster {
      min-height: 440px;
      position: relative;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(.82) contrast(1.1);
    }

    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #050505 0%, rgba(5,5,5,.58) 48%, transparent 100%);
    }

    .poster-copy {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 20px;
      z-index: 1;
    }

    .kicker {
      color: var(--red);
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 0;
      font-size: clamp(44px, 7vw, 78px);
      font-weight: 900;
      font-style: italic;
      line-height: .88;
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow: 0 0 24px rgba(220,38,38,.42);
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .summary {
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .summary-card,
    .metric-card {
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 12px;
      background: rgba(0,0,0,.34);
      padding: 14px;
    }

    .label {
      color: var(--muted);
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .value {
      margin-top: 6px;
      color: #fff;
      font-size: clamp(26px, 4vw, 38px);
      font-weight: 900;
      font-style: italic;
      line-height: 1;
    }

    .value.red { color: #ef4444; }
    .value.gold { color: #fbbf24; }

    .metrics {
      padding: 20px;
    }

    .metrics-title {
      margin: 0 0 12px;
      color: var(--red);
      font-family: "Courier New", monospace;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    .metric-card .value {
      font-size: 24px;
    }

    .advice-card {
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 12px;
      background: rgba(0,0,0,.34);
      padding: 16px;
    }

    .advice-status {
      color: var(--muted);
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .advice-text {
      margin: 10px 0 0;
      color: #f4f4f5;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .action {
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      color: #fff;
      padding: 0 18px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .action:hover {
      transform: translateY(-2px);
      border-color: var(--red);
      background: rgba(220,38,38,.14);
    }

    .action.primary {
      border-color: rgba(220,38,38,.6);
      background: #dc2626;
      box-shadow: 0 0 22px rgba(220,38,38,.28);
    }

    @media (max-width: 780px) {
      .result-shell { grid-template-columns: 1fr; }
      .poster { min-height: 260px; }
      .summary { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="screen">
    <section class="result-shell">
      <aside class="poster">
        <img src="images/a-gong.png" alt="">
        <div class="poster-copy">
          <div class="kicker">Training Complete</div>
          <h1>Practice Result</h1>
        </div>
      </aside>

      <section class="content">
        <section class="panel summary">
          <div class="summary-card">
            <div class="label">Time</div>
            <div class="value" id="elapsedTime">0:00</div>
          </div>
          <div class="summary-card">
            <div class="label">Punches</div>
            <div class="value red" id="punchCount">0</div>
          </div>
          <div class="summary-card">
            <div class="label">Average Score</div>
            <div class="value gold" id="averageScore">0</div>
          </div>
        </section>

        <section class="panel metrics" id="scorePanel">
          <h2 class="metrics-title">Score Breakdown</h2>
          <div class="metrics-grid" id="scoreGrid"></div>
        </section>

        <section class="panel metrics" id="metricPanel">
          <h2 class="metrics-title">Motion Metrics</h2>
          <div class="metrics-grid" id="metricGrid"></div>
        </section>

        <section class="panel metrics" id="advicePanel">
          <h2 class="metrics-title">AI Coach</h2>
          <div class="advice-card">
            <div class="advice-status" id="adviceStatus">Reading punch data</div>
            <p class="advice-text" id="adviceText"></p>
          </div>
        </section>

        <section class="actions">
          <button class="action primary" id="againButton" type="button">Practice Again</button>
          <button class="action" id="modeButton" type="button">Mode Select</button>
          <button class="action" id="homeButton" type="button">Home</button>
        </section>
      </section>
    </section>
  </main>

  <script>
    const result = JSON.parse(localStorage.getItem('trainingResult') || '{}');

    function formatTime(seconds) {
      const safeSeconds = Math.max(0, Number(seconds) || 0);
      const minutes = Math.floor(safeSeconds / 60);
      const remainingSeconds = Math.floor(safeSeconds % 60);
      return `${minutes}:${String(remainingSeconds).padStart(2, '0')}`;
    }

    function labelFor(key) {
      return key.replace(/_/g, ' ');
    }

    function renderGrid(elementId, panelId, values, suffix = '') {
      const grid = document.getElementById(elementId);
      const panel = document.getElementById(panelId);
      const entries = Object.entries(values || {}).filter(([key]) => key !== 'duration');

      if (!entries.length) {
        panel.style.display = 'none';
        return;
      }

      grid.innerHTML = entries.map(([key, value]) => {
        const numberValue = Number(value);
        const displayValue = Number.isFinite(numberValue)
          ? Math.round(numberValue * 10) / 10
          : value;

        return `
          <div class="metric-card">
            <div class="label">${labelFor(key)}${suffix}</div>
            <div class="value">${displayValue}</div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('elapsedTime').textContent = formatTime(result.elapsedSeconds);
    document.getElementById('punchCount').textContent = result.punchCount || 0;
    document.getElementById('averageScore').textContent = result.averageScore || 0;
    renderGrid('scoreGrid', 'scorePanel', result.details, ' score');
    renderGrid('metricGrid', 'metricPanel', result.metrics);

    async function loadPunchAdvice() {
      const status = document.getElementById('adviceStatus');
      const text = document.getElementById('adviceText');

      try {
        const response = await fetch('/punch-advice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: 'training', result })
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || 'Coach request failed');
        }

        status.textContent = payload.source === 'local'
          ? 'Local coach'
          : `Gemini coach: ${payload.source}`;
        text.textContent = payload.advice || 'No advice returned.';
      } catch (error) {
        status.textContent = 'Coach unavailable';
        text.textContent = error.message || 'Could not load punch advice.';
      }
    }

    loadPunchAdvice();

    document.getElementById('againButton').addEventListener('click', () => {
      window.location.href = 'training.html';
    });

    document.getElementById('modeButton').addEventListener('click', () => {
      window.location.href = 'mode.html';
    });

    document.getElementById('homeButton').addEventListener('click', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
