<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Result</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #050505;
      font-family: Arial, Helvetica, sans-serif;
    }

    .screen {
      width: 100vw;
      min-height: 100vh;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
    }

    .logo {
      width: 144px;
      height: 144px;
      object-fit: cover;
      border: 1px solid #ddd;
    }

    .result-lines {
      display: grid;
      gap: 12px;
      font-size: clamp(24px, 4vw, 32px);
    }

    .metrics-grid {
      width: min(92vw, 760px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .metric-card {
      padding: 10px 12px;
      border: 1px solid #222;
      background: #f7f7f7;
    }

    .metric-card .label {
      color: #555;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .metric-card .value {
      margin-top: 4px;
      color: #111;
      font-size: 24px;
      font-weight: 900;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 22px;
    }

    .action {
      min-width: 112px;
      padding: 3px 8px;
      border: 1px solid #222;
      background: #fff;
      color: #111;
      font: inherit;
      font-size: 24px;
      cursor: pointer;
    }

    .danger {
      border-color: #ff1616;
      color: #ff1616;
    }
  </style>
</head>
<body>
  <main class="screen">
    <img class="logo" src="images/a-gong.png" alt="">

    <section class="result-lines">
      <div>เวลา: <span id="elapsedTime">0:00</span> นาที</div>
      <div>จำนวนหมัด: <span id="punchCount">0</span> หมัด</div>
      <div>คะแนนเฉลี่ย: <span id="averageScore">0</span> แต้ม</div>
    </section>

    <section class="metrics-grid" id="scoreGrid"></section>
    <section class="metrics-grid" id="metricGrid"></section>

    <section class="actions">
      <button class="action danger" id="againButton" type="button">ฝึกอีกครั้ง</button>
      <button class="action" id="modeButton" type="button">กลับเลือกโหมด</button>
      <button class="action" id="homeButton" type="button">กลับหน้าหลัก</button>
    </section>
  </main>

  <script>
    const result = JSON.parse(localStorage.getItem('trainingResult') || '{}');

    function formatTime(seconds) {
      const safeSeconds = Math.max(0, Number(seconds) || 0);
      const minutes = Math.floor(safeSeconds / 60);
      const remainingSeconds = Math.floor(safeSeconds % 60);
      return `${minutes}:${String(remainingSeconds).padStart(2, '0')}`;
    }

    function labelFor(key) {
      return key.replace(/_/g, ' ');
    }

    function renderGrid(elementId, values, suffix = '') {
      const grid = document.getElementById(elementId);
      const entries = Object.entries(values || {}).filter(([key]) => key !== 'duration');

      if (!entries.length) {
        grid.style.display = 'none';
        return;
      }

      grid.innerHTML = entries.map(([key, value]) => {
        const numberValue = Number(value);
        const displayValue = Number.isFinite(numberValue)
          ? Math.round(numberValue * 10) / 10
          : value;

        return `
          <div class="metric-card">
            <div class="label">${labelFor(key)}${suffix}</div>
            <div class="value">${displayValue}</div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('elapsedTime').textContent = formatTime(result.elapsedSeconds);
    document.getElementById('punchCount').textContent = result.punchCount || 0;
    document.getElementById('averageScore').textContent = result.averageScore || 0;
    renderGrid('scoreGrid', result.details, ' score');
    renderGrid('metricGrid', result.metrics);

    document.getElementById('againButton').addEventListener('click', () => {
      window.location.href = 'training.html';
    });

    document.getElementById('modeButton').addEventListener('click', () => {
      window.location.href = 'mode.html';
    });

    document.getElementById('homeButton').addEventListener('click', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
